description = "Run all 7 news hunting sub-agents to discover AI news across the web"

[tools]
web_fetch = true
google_search = true
mcp = ["notebooklm-mcp"]

prompt = """Run the Hybrid News Hunting pipeline (Search + Deep Discovery).

PHASE 1: Deep Discovery (Real-Time Infrastructure Monitoring)
1. Run full discovery sweep via run_shell_command: `C:/Users/Manit/AppData/Local/Programs/Python/Python311/python.exe scripts/phase1_collect.py`
   - Lane A: X Home Feed + Watchlist (via the pinned XCLI in scripts/source_clis.py)
   - Lane B: Corporate RSS Blogs
   - Lane C: YouTube latest-video discovery via `scripts/orchestrate_videos.py`, using `yt-transcript latest` with the configured day window, followed by transcript pulls through the pinned YT Transcript CLI route.
   - Lane D: Reddit developer/community discussions through `reddit_mcp_buddy_collect.py` (reddit-mcp-buddy probe, RSS fallback, legacy JSON preservation fallback) + Hacker News
   - Lane E: GitHub + arXiv artifact/research discovery from `config/source_registry.json`
   - Lane F: Finance + macro intelligence from `finance_market_collector.py` covering Bloomberg/CNBC/India business/TLDR/SEC sources, filtered to AI market impact
   - Lane G: Startup fundraising + product signals from `startup_funding_collector.py`, focused on AI startups, Series A/B/C, funding amounts, investors, and launches

PHASE 2: Core Search (Breadth Scanning)
Execute the 7 sub-agents in sequence using google_search and web_fetch:
1. Automation Scout
2. Corporate Watcher
3. Leak Hunter
4. Research Tracker
5. Economics Analyst
6. Founder Insights
7. Tool Spotlight

For each agent:
- Follow references/news-hunting-agents.md protocols
- Grade relevance (0-10)

PHASE 3: Strategic Aggregation
1. Merge findings from Phase 1 and Phase 2 into data/news_queue.json.
2. Deduplicate and apply ranking (Relevance + Bonuses).
3. Save complete results and append run log to logs/agent_runs/.
4. Present the top findings in a table, explicitly highlighting any Phase 1 "Deep Discovery" wins.

Rules:
- Total Transparency: List all tool/script timeouts or failures first.
- Deep Signal Priority: If a sitemap/HF discovery exists, it must be featured.
"""
